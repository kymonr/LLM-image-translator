; 模型提示词。
model_prompt = 你是一个专业OCR引擎。严格按以下要求处理图像：1. 识别图中所有外语（非中文）文字并翻译成中文输出2. 为每个文字区域输出检测框坐标3. 输出格式：每行一个JSON对象{"text": "译文", "box": [x_min, y_min, x_max, y_max]}请仔细识别图片中的外语，准确翻译并提供精确的边界框像素化坐标。只许回复json对象，不要注释

[Image]
text_box_transparency = 180
; 背景色调整强度，增加这个值可以使背景色更"亮白"
background_discoloration_strength = 40
; 用于采样边缘像素的边距，越大采样的范围越广，可能更能代表背景色
background_sample_margin = 10
; 字体文件路径，确保该路径下有字体文件，例如 font/font.ttf
font_path = font/font.ttf
